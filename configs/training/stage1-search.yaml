version: 1
name: stage1-group-weights
base_config: baseline.yaml
seed_sets: seed-sets.yaml

evaluation:
  game_mode: 4p-red-east
  objective: average_rank_improvement
  budgets: [60, 300, 600]

parameters:
  shape_group:
    path: group_weights.shape
    initial: 1.0
    min: 0.5
    max: 1.5
    scale: linear
  value_group:
    path: group_weights.value
    initial: 1.0
    min: 0.5
    max: 1.5
    scale: linear
  risk_group:
    path: group_weights.risk
    initial: 1.0
    min: 0.7
    max: 1.3
    scale: linear
