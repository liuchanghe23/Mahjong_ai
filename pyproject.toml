[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mahjong-ai-local"
version = "0.1.0"
description = "Local riichi mahjong simulation and analysis project"
requires-python = ">=3.10,<3.15"
dependencies = [
    "riichienv==0.4.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

